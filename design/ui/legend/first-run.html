<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex World · First run</title>
<link rel="stylesheet" href="../assets/scene.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<div class="scene"><img src="../../../docs/checkpoints/ui-captures/ui-first-one.jpg" alt="The first meadow tile floating in the dark"><svg class="overlay" viewBox="0 0 1600 1000" aria-hidden="true"></svg></div>

<div data-mount="bar"></div>
<div class="ghost-tag is-gone" role="status"></div>
<div class="toast" data-toast role="status" aria-live="polite"></div>
<p class="sr" data-live aria-live="polite"></p>
<button class="show-ui" type="button" data-action="show-ui"><svg class="ic"><use href="#i-eye"/></svg>Show UI <kbd>H</kbd></button>

<section class="sheet sheet--tiles" data-panel data-region aria-label="Tile inventory">
  <header class="sheet__head">
    <h1>Tiles</h1>
    <kbd>Tab</kbd>
    <button class="sheet__close" type="button" data-action="inventory" aria-label="Close tiles, Tab" data-tip="Close|Tab"><svg><use href="#i-close"/></svg></button>
  </header>
  <div class="key" data-key></div>
  <div class="sheet__body">
    <h2 class="group" data-group="fit">Fits here <span data-count="fit">12</span></h2>
    <ul class="list list--fit" data-list="fit"></ul>
    <h2 class="group group--off" data-group="off">Doesn't fit here <span data-count="off">0</span><svg class="ic group__more" aria-hidden="true"><use href="#i-down"/></svg></h2>
    <ul class="list list--off" data-list="off"></ul>
  </div>
  <p class="sheet__foot"><kbd>1–9</kbd> pick <kbd>R</kbd> turn <kbd>F6</kbd> next panel</p>
</section>

<nav class="review-strip" aria-label="Review states">
  <a href="#default">Place hint</a><a href="#hint-rotate">Rotate hint</a><a href="#hint-undo">Undo hint</a><a href="#hint-bulldoze">Bulldoze hint</a><a href="#last-tile">S7.5 last tile</a>
</nav>

<script src="proto.js"></script>
<script>
  // A new world is one meadow tile (PRD A1): a native capture of the play scenario's first tile
  // (docs/checkpoints/ui-captures/ui-first-run.json), in photo mode so the engine's slot outlines stay
  // out of it. Slots are the six neighbours projected through the same camera; slot order is
  // upper-left, top, upper-right, lower-right, bottom, lower-left. `real` points each slot at the
  // same camera's capture of a meadow placed there, so placing Meadow shows the engine's pixels.
  const CAP = "../../../docs/checkpoints/ui-captures/";
  const RING = CAP + "ui-first-ring.jpg";
  window.WORLD = {
    scene: { src: CAP + "ui-first-one.jpg", x: 0, y: 0, s: Math.min(0.9, innerWidth / 1600, innerHeight / 1000) },
    grassAt: [593, 513],
    selected: "meadow",
    rise: 1800,
    slots: [
      { id: "W", coord: "(−1, 0)", pts: [[178, 453], [342, 405], [459, 453], [421, 567], [233, 634], [108, 567]], hull: [[100, 569], [174, 451], [344, 401], [466, 451], [473, 484], [436, 603], [245, 673], [118, 603]], needs: { 0: "G" } },
      { id: "NW", coord: "(0, −1)", pts: [[385, 319], [519, 282], [629, 319], [612, 403], [462, 451], [345, 403]], hull: [[339, 405], [381, 317], [520, 279], [634, 317], [637, 349], [621, 437], [469, 488], [349, 437]], needs: { 1: "G" } },
      { id: "NE", coord: "(1, −1)", pts: [[632, 319], [756, 282], [876, 319], [883, 403], [747, 451], [616, 403]], hull: [[610, 405], [628, 317], [756, 279], [881, 317], [889, 405], [887, 437], [748, 488], [615, 437]], needs: { 2: "G" } },
      { id: "E", coord: "(1, 0)", pts: [[749, 453], [885, 405], [1030, 453], [1056, 567], [906, 634], [743, 567]], hull: [[737, 569], [744, 451], [885, 401], [1036, 451], [1063, 569], [1057, 603], [903, 673], [739, 603]], needs: { 3: "G" } },
      { id: "SE", coord: "(0, 1)", pts: [[571, 637], [741, 570], [904, 637], [918, 799], [724, 898], [540, 799]], hull: [[531, 803], [565, 634], [741, 565], [910, 634], [926, 803], [922, 836], [726, 939], [540, 836]], needs: { 4: "G" } },
      { id: "SW", coord: "(−1, 1)", pts: [[234, 637], [422, 570], [566, 637], [534, 799], [312, 898], [156, 799]], hull: [[147, 803], [228, 634], [424, 565], [573, 634], [579, 668], [549, 836], [325, 939], [167, 836]], needs: { 5: "G" } },
    ],
    real: ["W", "NW", "NE", "E", "SE", "SW"].map((slot) => ({ slot, tile: "meadow", k: 0, src: RING })),
    tiles: [{ id: "m0", name: "Meadow", pts: [[464, 453], [614, 405], [745, 453], [739, 567], [569, 634], [426, 567]], block: "The world needs at least one tile", blockSub: "Place another before removing this one" }],
    hints: [
      {
        html: `${HW.icon("place")}Click a dashed slot to place Meadow`,
        anchor: () => { const r = document.querySelector("[data-slot=W]").getBoundingClientRect(); return [r.left + r.width * 0.45, r.top + r.height * 0.62]; },
        at: (a) => [a[0] - 170, a[1] + 170],
        done: ["hover", "place"],
      },
      {
        html: `<kbd>R</kbd> turns the tile before you place it`,
        when: (st) => !!st.slot,
        anchor: () => { const k = document.querySelector(".ghost-tag:not(.is-gone) kbd"); if (!k) return null; const r = k.getBoundingClientRect(); return [r.left + r.width / 2, r.bottom + 2]; },
        at: (a) => [a[0] - 60, a[1] + 70],
        done: ["rotate", "place"],
      },
      {
        html: `<kbd>⌘Z</kbd> takes it back`,
        when: (st) => st.undo.length > 0,
        anchor: () => { const r = document.querySelector(".tool[data-action=undo]").getBoundingClientRect(); return [r.left + r.width / 2, r.bottom + 2]; },
        at: (a) => [a[0] - 30, a[1] + 54],
        done: ["undo", "place"],
      },
      {
        html: `<kbd>B</kbd> clears a tile away`,
        when: (st) => st.undo.length > 1,
        anchor: () => { const r = document.querySelector(".tool[data-action=bulldoze]").getBoundingClientRect(); return [r.left + r.width / 2, r.bottom + 2]; },
        at: (a) => [a[0] - 30, a[1] + 54],
        done: ["bulldoze"],
      },
    ],
  };
  document.querySelector("[data-mount=bar]").outerHTML = HW.bar({ world: "New world", tiles: 1 });
  window.WORLD_STATES = {
    default: (a) => a.hints.start(0),
    "hint-rotate": (a) => { a.select("road_bend_60"); a.hover(a.slotById("W")); a.hints.start(1); },
    "hint-undo": (a) => {
      a.hover(a.slotById("W")); a.place();
      document.querySelectorAll(".placed").forEach((g) => g.classList.remove("is-rising"));
      a.hints.start(2);
    },
    "hint-bulldoze": (a) => {
      a.hover(a.slotById("W")); a.place(); a.hover(a.slotById("E")); a.place();
      document.querySelectorAll(".placed").forEach((g) => g.classList.remove("is-rising"));
      a.hints.start(3);
    },
    "last-tile": (a) => { a.setMode("bulldoze"); a.hoverTile(window.WORLD.tiles[0]); },
  };
  addEventListener("hashchange", () => location.reload());
</script>
<script src="play.js"></script>
</body>
</html>
