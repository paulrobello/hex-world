<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex World · Play</title>
<link rel="stylesheet" href="../assets/scene.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<div class="scene"><img src="../../../docs/checkpoints/ui-captures/ui-play-world.jpg" alt="The world: meadows, forest, a river, two houses on a road, and a beach running into the sea"><svg class="overlay" viewBox="0 0 1600 1000" aria-hidden="true"></svg></div>

<div data-mount="bar"></div>
<div class="ghost-tag is-gone" role="status"></div>
<div class="toast" data-toast role="status" aria-live="polite"></div>
<p class="sr" data-live aria-live="polite"></p>
<button class="show-ui" type="button" data-action="show-ui"><svg class="ic"><use href="#i-eye"/></svg>Show UI <kbd>H</kbd></button>
<div class="stream-chip" data-stream hidden role="status"><svg class="ic"><use href="#i-import"/></svg><span>Loading coast pack</span><span class="progress"><i style="--p:62%"></i></span><span>2.4 MB</span></div>

<section class="sheet sheet--tiles" data-panel data-region aria-label="Tile inventory">
  <header class="sheet__head">
    <h1>Tiles</h1>
    <kbd>Tab</kbd>
    <button class="sheet__close" type="button" data-action="inventory" aria-label="Close tiles, Tab" data-tip="Close|Tab"><svg><use href="#i-close"/></svg></button>
  </header>
  <div class="key" data-key></div>
  <div class="sheet__body">
    <h2 class="group" data-group="fit">Fits here <span data-count="fit">3</span></h2>
    <ul class="list list--fit" data-list="fit"></ul>
    <h2 class="group group--off" data-group="off">Doesn't fit here <span data-count="off">9</span><svg class="ic group__more" aria-hidden="true"><use href="#i-down"/></svg></h2>
    <ul class="list list--off" data-list="off"></ul>
  </div>
  <p class="sheet__foot"><kbd>1–9</kbd> pick <kbd>R</kbd> turn <kbd>F6</kbd> next panel</p>
</section>

<nav class="review-strip" aria-label="Review states">
  <a href="#open-idle">S3.1</a><a href="#default">S3.2</a><a href="#slot-grass">S3.3</a><a href="#nothing-fits">S3.4</a><a href="#tile-hover">S3.5</a><a href="#select-blocked">S3.7</a><a href="#keyboard">S3.8</a><a href="#closed">S3.9</a><a href="#rotate">S4.2</a><a href="#rotate-clash">S4.4</a><a href="#placed">S5.1</a><a href="#place-rejected">S5.2</a><a href="#undo">S6.1</a><a href="#redo">S6.2</a><a href="#undo-repeat">S6.3</a><a href="#undo-empty">S6.4</a><a href="#bulldoze">S7.2</a><a href="#bulldoze-done">S7.3</a><a href="#bulldoze-split">S7.4</a><a href="#hud-hidden">S2.3</a><a href="#tooltip">S2.4</a><a href="#streaming">S1.5</a><a href="#saving">S10.1</a><a href="#storage-off">S10.9</a>
</nav>

<script src="proto.js"></script>
<script>
  // The busy world: a native play-scenario capture (docs/checkpoints/ui-captures/ui-play.json), 14 real
  // tiles at the play camera's angle, in photo mode so the engine's own slot outlines stay out of it.
  // Slot and tile outlines are those cells projected through the same camera into the capture's
  // 1600x1000 space; each slot's needs are its real neighbours' edges. Edge e of a slot runs
  // pts[e+2] to pts[e+3]. `real` lists the placements the engine was captured making at the same
  // camera, so placing them shows the engine's pixels; any other placement falls back to a stand-in.
  const CAP = "../../../docs/checkpoints/ui-captures/";
  window.WORLD = {
    scene: { src: CAP + "ui-play-world.jpg", x: 0, y: 0, s: Math.min(0.9, innerWidth / 1600, innerHeight / 1000) },
    grassAt: [592, 494],
    selected: "river_bend",
    rise: 1800,
    history: [
      { kind: "seed", text: "placed House cluster at (1, 2)" },
      { kind: "seed", text: "placed Meadow at (−1, 3)" },
      { kind: "seed", text: "placed Forest at (0, 3)" },
    ],
    slots: [
      { id: "A", coord: "(−2, 0)", pts: [[251, 467], [332, 442], [389, 467], [368, 521], [281, 550], [222, 521]], hull: [[218, 522], [248, 466], [333, 440], [393, 466], [397, 482], [375, 538], [286, 569], [225, 538]], needs: { 0: "G", 1: "V" } },
      { id: "B", coord: "(1, −1)", pts: [[617, 395], [684, 373], [746, 395], [743, 441], [672, 466], [608, 441]], hull: [[605, 442], [614, 394], [684, 372], [748, 394], [749, 410], [746, 458], [674, 484], [607, 458]], needs: { 1: "G", 2: "G" }, adj: { 0: "C" } },
      { id: "C", coord: "(2, −1)", pts: [[748, 395], [812, 373], [877, 395], [880, 441], [813, 466], [745, 441]], hull: [[742, 442], [745, 394], [812, 372], [879, 394], [883, 442], [882, 458], [813, 484], [743, 458]], needs: { 1: "O", 2: "G" }, adj: { 3: "B" }, nearest: "A", noneWhy: "No tile carries both a river and the sea." },
    ],
    real: [
      { slot: "A", tile: "river_bend", k: 1, src: CAP + "ui-play-placed.jpg" },
      { slot: "B", tile: "meadow", k: 0, src: CAP + "ui-play-placed.jpg" },
      { slot: "C", tile: "beach", k: 0, src: CAP + "ui-play-placed.jpg" },
      { slot: "B", tile: "river_straight", k: 0, src: CAP + "ui-play-alt.jpg" },
    ],
    tiles: [
      { id: "t1", name: "Meadow", pts: [[544, 769], [640, 727], [724, 769], [719, 861], [616, 911], [527, 861]], hull: [[522, 863], [541, 767], [640, 724], [728, 767], [729, 784], [724, 879], [619, 932], [527, 879]], goneSrc: CAP + "ui-play-alt.jpg" },
      { id: "coast", name: "Beach", pts: [[673, 467], [744, 442], [812, 467], [813, 521], [738, 550], [667, 521]], block: "Removing this would split your world", blockSub: "2 ocean tiles would be cut off", cut: [[[814, 467], [881, 442], [953, 467], [961, 521], [890, 550], [815, 521]], [[955, 467], [1019, 442], [1094, 467], [1109, 521], [1043, 550], [963, 521]]] },
    ],
  };
  document.querySelector("[data-mount=bar]").outerHTML = HW.bar({ world: "Riverside", tiles: 14 });
  const still = (fn) => (HW.still ? fn() : null);
  window.WORLD_STATES = {
    default: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); },
    "open-idle": (a) => a.select("river_bend"),
    "slot-grass": (a) => { a.select("meadow"); a.hover(a.slotById("B")); },
    "slot-beach": (a) => { a.select("beach"); a.hover(a.slotById("C")); },
    "nothing-fits": (a) => {
      a.select("river_straight"); a.hover(a.slotById("B")); a.place();
      document.querySelectorAll(".placed").forEach((g) => g.classList.remove("is-rising"));
      a.hover(a.slotById("C"));
    },
    "tile-hover": (a) => { a.select("river_bend"); a.hover(a.slotById("A")); document.querySelector(".row[data-tile=river_straight]").classList.add("is-hover"); },
    "select-blocked": (a) => { a.select("meadow"); a.hover(a.slotById("A")); },
    keyboard: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); document.querySelector(".row[data-tile=river_straight]").focus(); },
    closed: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); a.toggleSheet(false); },
    rotate: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); a.rotate(); },
    "rotate-clash": (a) => { a.st.manual = true; a.select("river_bend"); a.hover(a.slotById("A")); a.st.ri = 2; a.drawGhost(); },
    placed: (a) => {
      a.select("river_bend"); a.hover(a.slotById("A")); a.place();
      still(() => document.querySelectorAll(".placed").forEach((g) => { g.dataset.hold = ""; g.style.animationDelay = "-1000ms"; }));
    },
    "place-rejected": (a) => {
      a.select("meadow"); a.hover(a.slotById("A")); a.place();
      still(() => document.querySelectorAll(".ghost-g .g-edge.is-bad").forEach((el) => { el.dataset.hold = ""; el.style.animationDelay = "-120ms"; }));
    },
    undo: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); a.place(); a.undoRedo(false); },
    redo: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); a.place(); a.undoRedo(false); a.undoRedo(true); },
    "undo-repeat": (a) => {
      a.select("river_bend"); a.hover(a.slotById("A")); a.place();
      a.select("meadow"); a.hover(a.slotById("B")); a.place();
      a.select("beach"); a.hover(a.slotById("C")); a.place();
      a.undoRedo(false); a.undoRedo(false); a.undoRedo(false);
      a.select("river_bend"); a.hover(a.slotById("A"));
    },
    "undo-empty": (a) => { a.st.undo = []; a.syncTools(); a.select("river_bend"); a.hover(a.slotById("A")); HW.showTip(document.querySelector(".tool[data-action=undo]")); },
    "redo-empty": (a) => { a.select("river_bend"); a.hover(a.slotById("A")); HW.showTip(document.querySelector(".tool[data-action=redo]")); },
    tooltip: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); HW.showTip(document.querySelector(".tool[data-action=photo]")); },
    bulldoze: (a) => { a.setMode("bulldoze"); a.hoverTile(window.WORLD.tiles[0]); },
    "bulldoze-done": (a) => { a.setMode("bulldoze"); const t = window.WORLD.tiles[0]; a.hoverTile(t); t.hit.dispatchEvent(new MouseEvent("click", { bubbles: true })); },
    "bulldoze-split": (a) => { a.setMode("bulldoze"); a.hoverTile(window.WORLD.tiles[1]); },
    "hud-hidden": (a) => { a.select("river_bend"); document.body.classList.add("hud-hidden"); },
    streaming: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); document.querySelector("[data-stream]").hidden = false; },
    saving: (a) => { a.select("river_bend"); a.hover(a.slotById("A")); document.querySelector("[data-save]").dataset.state = "saving"; },
    "storage-off": (a) => {
      a.select("river_bend"); a.hover(a.slotById("A")); document.querySelector("[data-save]").dataset.state = "off";
      HW.toast({ text: "Autosave is off in this window", sub: "This browser blocks storage here. Export keeps your world.", action: "Export", icon: "alert", tone: "caution", sticky: true });
    },
  };
  addEventListener("hashchange", () => location.reload());
</script>
<script src="play.js"></script>
</body>
</html>
