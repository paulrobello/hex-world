<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Hex World social share image</title>
  <!-- The in-engine play shot framed like the owner's play screenshot (R8; docs/checkpoints/share-image/share-play.py, framing c), set on its own void colour. -->
  <rect width="1200" height="630" fill="#0e100f"/>
  <image x="230" y="40" width="992" height="620" href="../../docs/checkpoints/share-image/share-c-front-right.jpg"/>
  <image x="64" y="50" width="64" height="64" href="concept-b1.svg"/>
  <g font-family="Manrope ExtraLight">
    <text x="146" y="106" font-size="66" font-weight="800" fill="#eef3f6">Hex World</text>
    <text x="64" y="172" font-size="30" font-weight="700" fill="#eef3f6">A browser world-building game.</text>
    <text x="64" y="212" font-size="23" font-weight="500" fill="#b0c5d6">Pick a hex tile, match its edges, watch the world come alive.</text>
    <text x="64" y="590" font-size="20" font-weight="600" fill="#849cb0">hex-world.pardev.net</text>
  </g>
  <!-- Six-block socket code: Beach, Grass, Forest, Ocean, River, Road. -->
  <g>
    <rect x="64" y="538" width="20" height="20" rx="3" fill="#e3c27a"/>
    <rect x="88" y="538" width="20" height="20" rx="3" fill="#9cc464"/>
    <rect x="112" y="538" width="20" height="20" rx="3" fill="#3f8a4f"/>
    <rect x="136" y="538" width="20" height="20" rx="3" fill="#2d6fb0"/>
    <rect x="160" y="538" width="20" height="20" rx="3" fill="#4aa3df"/>
    <rect x="184" y="538" width="20" height="20" rx="3" fill="#e2683c"/>
  </g>
</svg>
