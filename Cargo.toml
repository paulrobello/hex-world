[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false }

[workspace.lints.clippy]
type_complexity = "warn"
too_many_arguments = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "debuginfo"

[profile.wasm-release.package.hex-core]
opt-level = 3

[profile.wasm-release.package.hex-render]
opt-level = 3

[profile.wasm-release.package.hex-play]
opt-level = 3

[profile.wasm-release.package.hex-play-state]
opt-level = 3

[profile.wasm-release.package.hex-assets]
opt-level = 3

[profile.wasm-release.package.hex-sim]
opt-level = 3

[profile.wasm-release.package.hex-app]
opt-level = 3
