[package]
name = "hex-play"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
gate-tools = ["hex-render/gate-tools"]

[dependencies]
hex-render = { path = "../hex-render" }
hex-play-state = { path = "../hex-play-state" }
hex-core = { path = "../hex-core" }
hex-assets = { path = "../hex-assets", features = ["bevy"] }
bytemuck = { workspace = true }
# Bevy 0.20's own wgpu, for the GPU timestamp query set and pass timestamp writes (`gpu_timing`),
# which `bevy::render::render_resource` does not re-export.
wgpu = { workspace = true }
serde_json = { workspace = true }
# Bevy features are declared in hex-render, which hex-play always builds with; feature
# unification within `cargo check -p hex-play` therefore supplies this crate's set.
bevy = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgpu"] }

# Render extraction and ECS queries mirror Bevy pipeline interfaces.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[dev-dependencies]
gltf = { workspace = true, features = ["extras"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
