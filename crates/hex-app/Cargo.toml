[package]
name = "hex-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hex-world"
path = "src/main.rs"

[dependencies]
hex-play = { path = "../hex-play", features = ["gate-tools"] }
hex-core = { path = "../hex-core" }
hex-render = { path = "../hex-render" }
hex-play-state = { path = "../hex-play-state" }
hex-sim = { path = "../hex-sim" }
bevy = { workspace = true }
crc32fast = "=1.5.2"
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "console"] }

[lints]
workspace = true
