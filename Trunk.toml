[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8094
open = false

# The UI overlay builds into web/ui/dist before every Trunk build (trunk build and trunk serve), so the
# site always ships the current HUD. Its output and tooling must not retrigger a serve rebuild.
[watch]
ignore = ["web/ui/dist", "web/ui/node_modules"]

[[hooks]]
stage = "pre_build"
command = "make"
command_arguments = ["--no-print-directory", "ui-build"]

# Cache busting (scripts/web/version-dist.mjs): every staged file gets a content hash, inlined into
# index.html as window.__HEX_HASHES, and every URL the page fetches carries it as ?v=<hash>. Runs on
# the staging dir ($TRUNK_STAGING_DIR) before Trunk moves it to dist.
[[hooks]]
stage = "post_build"
command = "node"
command_arguments = ["scripts/web/version-dist.mjs"]
