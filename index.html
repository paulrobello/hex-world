<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:"
    />
    <title>Hex World</title>
    <meta name="description" content="A browser world-building game on hex tiles. Pick a tile, rotate it until its edges match its neighbours, and grow a living diorama." />
    <meta name="theme-color" content="#12273a" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/web/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/web/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/web/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/web/brand/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hex-world.pardev.net/" />
    <meta property="og:title" content="Hex World" />
    <meta property="og:description" content="A browser world-building game on hex tiles. Pick a tile, match its edges, and watch the world come alive." />
    <meta property="og:image" content="https://hex-world.pardev.net/web/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hex World: a floating hex-tile island with a river running into the sea." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #1d2126; overflow: hidden; }
      canvas#hex-world { display: block; width: 100%; height: 100%; outline: none; }
      #diag { position: fixed; top: 8px; left: 8px; padding: 6px 8px; background: rgb(0 0 0 / 0.6);
              color: #e6e6e6; font: 12px/1.4 ui-monospace, monospace; white-space: pre; display: none; }
    </style>
    <script src="web/wgsl-compat.js"></script>
    <!-- The Legend HUD overlay (PRD D18): loading layer, tool bar and Tiles sheet. Source: web/ui. -->
    <link rel="stylesheet" href="web/ui/hud.css" />
    <script defer src="web/ui/hud.js"></script>
    <script>
      // WebGPU gate before the wasm loads (PRD D2, TC4).
      (function () {
        function bail() { window.location.replace("web/unsupported.html"); }
        if (!("gpu" in navigator) || !navigator.gpu) return bail();
        navigator.gpu.requestAdapter().then(function (a) { if (!a) bail(); }).catch(bail);
      })();
    </script>
    <link data-trunk rel="rust" href="crates/hex-app/Cargo.toml" data-bin="hex-world" data-cargo-profile="wasm-release" data-wasm-opt="z" />
    <!-- web/ ships piecewise so the overlay's sources and tooling (web/ui) stay out; only its build ships. -->
    <link data-trunk rel="copy-dir" href="web/brand" data-target-path="web/brand" />
    <link data-trunk rel="copy-file" href="web/unsupported.html" data-target-path="web" />
    <link data-trunk rel="copy-file" href="web/unsupported.jpg" data-target-path="web" />
    <link data-trunk rel="copy-file" href="web/wgsl-compat.js" data-target-path="web" />
    <link data-trunk rel="copy-dir" href="web/ui/dist" data-target-path="web/ui" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="copy-file" href="CNAME" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
  </head>
  <body>
    <canvas id="hex-world"></canvas>
    <div id="diag"></div>
    <script>
      addEventListener("TrunkApplicationStarted", function () {
        var w = window.wasmBindings;
        if (!w) { console.error("hexWorld: wasmBindings missing"); return; }
        var queued = [], watchers = [];
        function pump() {
          var batch = JSON.parse(w.hex_world_events());
          if (!batch.length) return;
          queued = queued.concat(batch).slice(-256);
          for (var i = 0; i < watchers.length; i++) watchers[i](batch);
        }
        // events_pending counts what events() would return: the wasm queue plus the pumped JS queue.
        function state() {
          var s = JSON.parse(w.hex_world_state_json());
          if (typeof s.events_pending === "number") s.events_pending += queued.length;
          return s;
        }
        window.hexWorld = {
          ready: function () { return w.hex_world_ready(); },
          state: state,
          diag: function () { return JSON.parse(w.hex_world_diag_json()); },
          dumpState: state,
          // One command object or an array; parse errors are logged with console.error by wasm.
          cmd: function (json) {
            if (typeof json !== "string") json = JSON.stringify(json);
            w.hex_world_cmd(json);
          },
          // Drains queued game events (tilePlaced, placementRefused, undone, ...), oldest first. The
          // UI overlay sees every batch through watchEvents without taking events from callers here.
          events: function () { pump(); var out = queued; queued = []; return out; },
          watchEvents: function (cb) { watchers.push(cb); },
          pumpEvents: pump,
          // [left, top, right, bottom] in CSS px around cell (q, r) for the current camera, or null.
          cellRect: function (q, r) { return JSON.parse(w.hex_world_cell_rect(q, r)); },
          // Play-scenario actions: typed wrappers over cmd, queued like any other command.
          selectTile: function (id) { this.cmd({ cmd: "select_tile", id: id }); },
          hover: function (q, r) { this.cmd({ cmd: "hover", q: q, r: r }); },
          rotateGhost: function (dir) { this.cmd({ cmd: "rotate", dir: dir || "cw" }); },
          placeTile: function (q, r) { this.cmd({ cmd: "place", q: q, r: r }); },
          undo: function () { this.cmd({ cmd: "undo" }); },
          redo: function () { this.cmd({ cmd: "redo" }); },
          bulldoze: function (q, r) { this.cmd({ cmd: "bulldoze", q: q, r: r }); },
          setTool: function (mode) { this.cmd({ cmd: "set_tool", mode: mode }); },
          toggle: function (what) { this.cmd({ cmd: "toggle", what: what }); },
          // Resolves to a PNG data URL once the capture lands, after any queued commands.
          screenshot: function (name, timeoutMs) {
            name = name || "shot-" + Date.now();
            var deadline = Date.now() + (timeoutMs || 10000);
            w.hex_world_screenshot(name);
            return new Promise(function (resolve, reject) {
              (function poll() {
                var url = w.hex_world_take_shot(name);
                if (url) return resolve(url);
                if (Date.now() > deadline) return reject(new Error("hexWorld.screenshot timed out: " + name));
                setTimeout(poll, 100);
              })();
            });
          },
        };
        if (new URLSearchParams(location.search).get("diag") === "1") {
          var el = document.getElementById("diag");
          el.style.display = "block";
          setInterval(function () { el.textContent = JSON.stringify(window.hexWorld.diag(), null, 1); }, 500);
        }
      });
    </script>
  </body>
</html>
